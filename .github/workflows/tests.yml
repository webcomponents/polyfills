name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.5

      - name: NPM install
        run: npm ci

      - name: Check lint
        run: npm run lint

      - name: Check formatting
        run: npm run format && git diff --exit-code

  local:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.5

      - name: NPM install
        run: npm ci

      - name: Lerna bootstrap
        run: npm run bootstrap

      - name: Install playwright browsers (+ deps)
        run: |
          cd packages/tests && npx playwright install --with-deps
          cd $GITHUB_WORKSPACE/packages/scoped-custom-element-registry && npx playwright install --with-deps

      - name: Build
        run: npm run build

      - name: Test
        run: lerna run test --concurrency 1 --stream --no-bail
